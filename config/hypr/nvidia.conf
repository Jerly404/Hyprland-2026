# Hyprland Nvidia Configuration
# See https://wiki.hypr.land/Nvidia/
# Set to iHD to use Intel integrated GPU for hardware video decoding (more energy efficient)
env = LIBVA_DRIVER_NAME,iHD
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# Multi-GPU / Aquamarine (Intel iGPU card2 principal para pantallas DP-2/eDP-2, NVIDIA dGPU card1 secundaria para juegos)
# NO usar /dev/dri/by-path: Aquamarine separa los paths por ':' y el ':' interno de
# pci-0000:01:00.0-card rompe el listado -> "Found no gpus to use" -> crash en initServer.
env = AQ_DRM_DEVICES,/dev/dri/card2:/dev/dri/card1

# Hardware acceleration & Sync
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1
env = __GL_MAX_FRAMES_IN_FLIGHT,1
# AQ_FORCE_LINEAR_BLIT no es necesario con Intel como GPU principal
# env = AQ_FORCE_LINEAR_BLIT,1



# Wayland compatibility
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland;xcb

# Fix for monitor not showing image
cursor {
    no_hardware_cursors = true
}


#  // P̳r̳a̳s̳a̳n̳t̳h̳ R̳a̳n̳g̳a̳n̳

$GTK_THEME=Catppuccin-Mocha
$ICON_THEME = Tela-circle-dracula
$COLOR_SCHEME = prefer-dark

# Optional: The varibles above will be set automatically when the theme is loaded
# This exec commands will soon be deprecated


general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    col.active_border = rgba(d98bb8ff)
    col.inactive_border = rgba(2c1845bb)
    layout = dwindle
    resize_on_border = true
}

group {
    col.border_active = rgba(d98bb8ff)
    col.border_inactive = rgba(2c1845aa)
    col.border_locked_active = rgba(d98bb8ff)
    col.border_locked_inactive = rgba(2c1845aa)
}

decoration {
    rounding = 14
    shadow:enabled = false

    blur {
        enabled = false
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}

layerrule = blur,waybar

# Perfil ligero persistente.
animations {
    enabled = false
}
decoration {
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
}
misc {
    animate_manual_resizes = false
}

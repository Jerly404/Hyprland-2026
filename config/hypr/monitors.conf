# █░▀░█ █▄█ █░▀█ █ ░█░ █▄█ █▀▄ ▄█

# Configuración: Externo como Principal a 120Hz nativo

# Monitor Externo Gigabyte GS27QA (compatible con puerto DP-1 o DP-2)
monitor = desc:GIGA-BYTE TECHNOLOGY CO. LTD. GS27QA 0x01010101, 2560x1440@120, 0x0, 1, vrr, 0
monitor = DP-1, 2560x1440@120, 0x0, 1, vrr, 0
monitor = DP-2, 2560x1440@120, 0x0, 1, vrr, 0

# Monitor de la Laptop (eDP-2) - A la derecha del monitor 2K
monitor = eDP-2, 1920x1080@144, 2560x0, 1, vrr, 1

# Reglas de Workspaces (Modo Dual)
# Monitor Externo -> Workspaces 1, 2, 3
workspace = 1, monitor:desc:GIGA-BYTE TECHNOLOGY CO. LTD. GS27QA 0x01010101, default:true, persistent:true
workspace = 2, monitor:desc:GIGA-BYTE TECHNOLOGY CO. LTD. GS27QA 0x01010101, persistent:true
workspace = 3, monitor:desc:GIGA-BYTE TECHNOLOGY CO. LTD. GS27QA 0x01010101, persistent:true

# Monitor de la Laptop (eDP-2) -> Workspaces 4, 5, 6
workspace = 4, monitor:eDP-2, default:true, persistent:true
workspace = 5, monitor:eDP-2, persistent:true
workspace = 6, monitor:eDP-2, persistent:true

$HYDE_HYPRLAND=set #! Do not remove - HyDE marker to prevent file overwrite

#* Hyprland main configuration file.
#* Re-organized for stability and correctness.

# 1. Environment Variables & Hardware
source = ./nvidia.conf     # Critical for NVIDIA users
source = ./monitors.conf   # Monitor setup

# 2. HyDE Fallback (Initial Defaults)
# This provides the base HyDE functionality.
source = $HOME/.local/share/hyde/hyprland.conf 

# 3. User Overrides (Your personal settings)
# These files are sourced LAST so they have the highest priority.
source = ./animations.conf # Animations
source = ./keybindings.conf # Keyboard shortcuts
source = ./windowrules.conf # Window rules
source = ./userprefs.conf   # Personal preferences (mouse, kbd, etc)
source = ./workflows.conf   # Workflows if any
source = ./shaders.conf     # Shaders if any

# Note: All Files Above are yours to modify!

# === Reglas para Red Dead Redemption 2 (Gamescope) ===
windowrule = monitor DP-1, match:class ^(gamescope)$
windowrule = fullscreen 1, match:class ^(gamescope)$

# Hyprbars is loaded natively from lua/macos.lua, including on session startup.

# Theme metadata for legacy HyDE tools; compositor settings live in lua/macos.lua.
$GTK_THEME = Catppuccin-Mocha
$ICON_THEME = Tela-circle-dracula
$COLOR_SCHEME = prefer-dark
$CURSOR_THEME = Bibata-Modern-Ice
$CURSOR_SIZE = 24
$FONT = Inter
$FONT_SIZE = 11
$DOCUMENT_FONT = Inter
$DOCUMENT_FONT_SIZE = 11
$MONOSPACE_FONT = JetBrainsMono Nerd Font
$MONOSPACE_FONT_SIZE = 11
$BUTTON_LAYOUT = close,minimize,maximize:

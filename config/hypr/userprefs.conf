# Hyprland User Preferences - AESTHETIC EDITION

input {
    kb_layout = latam,us
    follow_mouse = 1
    sensitivity = 0.6 # Rango de -1.0 a 1.0 (aumenta la velocidad/DPI del puntero)

    touchpad {
        natural_scroll = yes
        tap-to-click = yes
        disable_while_typing = yes
        middle_button_emulation = yes
        clickfinger_behavior = no
    }
}

env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = SCREENSHOT_ANNOTATION_ENABLED,false

cursor {
    no_hardware_cursors = true
    inactive_timeout = 0
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    
    # Velvet Dusk: rosa-púrpura directo al borde
    col.active_border = rgba(d98bb8ff)
    col.inactive_border = rgba(2c1845bb)
    
    layout = dwindle
    resize_on_border = true
    hover_icon_on_border = true
}

decoration {
    rounding = 14
    rounding_power = 2

    # Sombra eliminada
    shadow {
        enabled = false
    }

    # Jerarquía visual elegante (ventana activa enfocada, inactiva con sutil transparencia)
    active_opacity = 1.00
    inactive_opacity = 1.00
    fullscreen_opacity = 1.00
    
    blur {
        enabled = false
        size = 4
        passes = 1
        new_optimizations = true
        ignore_opacity = true
        xray = false
        popups = true         # Blur en menús flotantes y contextuales
        popups_ignorealpha = 0.2
        vibrancy = 0.12
        contrast = 0.96
        brightness = 0.96
    }
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

# Animaciones cortas y fluidas: elegantes sin sentirse pesadas.
animations {
    enabled = no
    # Evita una animación en bucle que no se aprecia con el borde sólido.
    animation = borderangle, 0

    bezier = softOut, 0.16, 1, 0.30, 1
    bezier = softIn, 0.40, 0, 0.80, 0.20
    bezier = workspaceFlow, 0.20, 0.85, 0.20, 1

    animation = windowsIn, 1, 3.2, softOut, popin 92%
    animation = windowsOut, 1, 2.4, softIn, popin 92%
    animation = windowsMove, 1, 3.0, softOut, slide
    animation = border, 1, 2.5, softOut
    animation = fade, 1, 2.2, softOut
    animation = workspaces, 1, 3.4, workspaceFlow, slidefade 12%
    animation = specialWorkspace, 1, 3.0, softOut, slidefadevert 12%
    animation = layersIn, 1, 2.6, softOut, fade
    animation = layersOut, 1, 2.0, softIn, fade
}
# Mantener márgenes consistentes en todas las ventanas (evita estiramiento a pantalla completa)
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vrr = 1
    animate_manual_resizes = false
    initial_workspace_tracking = true
}

xwayland {
    force_zero_scaling = true
}

# COMPORTAMIENTO DE LA TAPA (LID SWITCH)
bindl = , switch:on:Lid Status, exec, hyprctl keyword monitor "eDP-2, disable"
bindl = , switch:off:Lid Status, exec, hyprctl keyword monitor "eDP-2, 1920x1080@144, 2560x0, 1.0"

# Salida de audio (Monitor Gigabyte / Laptop)
bindd = $mainMod Shift, M, $d cambiar audio al monitor Gigabyte, exec, /home/jerly404/.local/bin/switch-audio monitor
bindd = $mainMod Shift, L, $d cambiar audio a los altavoces de la laptop, exec, /home/jerly404/.local/bin/switch-audio laptop

# bind = SUPER, J, exec, /home/jerly404/dev/jarvis/jarvis-pro/trigger.sh

# Reglas de ventana para Picture-in-Picture (PiP) en Brave/Chromium
# Soporta tanto inglés (Picture-in-picture) como español (Imagen en imagen)
windowrule = float true, match:title ^(?i)(picture-in-picture|imagen en imagen)$
windowrule = pin true, match:title ^(?i)(picture-in-picture|imagen en imagen)$
windowrule = keep_aspect_ratio true, match:title ^(?i)(picture-in-picture|imagen en imagen)$
windowrule = size 25% 25%, match:title ^(?i)(picture-in-picture|imagen en imagen)$

# Configuración personalizada de capturas de pantalla (tamaño uniforme y sin distorsión)
binddl = , Print, $d capturar ambas pantallas igualadas, exec, hyde-shell screenshot p
bindd = $mainMod, Print, $d captura de ventana activa, exec, hyde-shell screenshot w
binddl = $mainMod Alt, Print, $d captura ambas pantallas retrasada 5s, exec, hyde-shell screenshot d 5
bindd = $mainMod Shift, Print, $d captura de area retrasada 5s, exec, hyde-shell screenshot ds 5

# Atajo personalizado para ocultar/mostrar la barra (Waybar)
bindd = $mainMod Alt, B, $d ocultar/mostrar barra de estado, exec, /home/jerly404/.local/bin/lavender-sidebar toggle

# Atajo para alternar modo de fondo (Extendido / Individual)
bindd = $mainMod Alt, W, $d alternar modo de fondo (extendido / individual), exec, ~/.config/hypr/scripts/toggle-wallmode.sh toggle

# Atajo para pausar/reanudar wallpaper animado (ahorro instantáneo de GPU/batería)
bindd = $mainMod Alt, V, $d pausar o reanudar wallpaper animado, exec, ~/.config/hypr/scripts/toggle-wallpause.sh

# ==============================================================================
# MACRO DE RATÓN (RÁFAGA / AUTOCLICKER)
# ==============================================================================
# Alternar macro (Off -> 5 Clicks -> 10 Clicks -> Off) con notificación visual y sonido
bindd = $mainMod Alt, C, $d alternar macro click izquierdo (off/5/10), exec, /home/jerly404/.local/bin/mouse-macro cycle
# Disparo instantáneo de ráfaga en la posición actual del puntero
bindd = $mainMod Shift, C, $d rafaga instantanea de clicks, exec, /home/jerly404/.local/bin/mouse-macro burst


# ==============================================================================
# REGLAS INTELIGENTES DE VENTANAS (AESTHETIC & EFFICIENCY)
# ==============================================================================

# Forzar opacidad en navegadores, reproductores de video y juegos
windowrule = opacity 1.0 0.75, match:class ^(zen)$
windowrule = opacity 1.0 1.0, match:class ^(brave-browser|firefox|google-chrome|chromium|LibreWolf)$
windowrule = opacity 1.0 1.0, match:class ^(mpv|vlc|celluloid|com.github.rafostar.Clapper)$
windowrule = opacity 1.0 1.0, match:class ^(steam|steamwebhelper)$
windowrule = workspace 1, match:class ^(steam|steamwebhelper)$
windowrule = float true, match:class ^(steam|steamwebhelper)$
windowrule = size 80% 80%, match:class ^(steam|steamwebhelper)$

# Terminal Kitty: Tiling con márgenes elegantes y opacidad nativa
windowrule = opacity 1.0 1.0, match:class ^(kitty)$

# Diálogos del sistema y herramientas de configuración: Flotantes y centrados
windowrule = float true, match:class ^(org.pulseaudio.pavucontrol|pavucontrol|blueman-manager|nm-connection-editor|nwg-look|qt5ct|qt6ct|kvantummanager)$
windowrule = size 680 480, match:class ^(org.pulseaudio.pavucontrol|pavucontrol|blueman-manager)$
windowrule = center true, match:class ^(org.pulseaudio.pavucontrol|pavucontrol|blueman-manager|nm-connection-editor|nwg-look|qt5ct|qt6ct|kvantummanager)$

# Selectores de archivos y diálogos del sistema
windowrule = float true, match:title ^(Open File|Save File|Abrir archivo|Guardar archivo|Choose Files|All Files|Confirm to replace files|File Operation Progress)$
windowrule = center true, match:title ^(Open File|Save File|Abrir archivo|Guardar archivo|Choose Files|All Files|Confirm to replace files|File Operation Progress)$
windowrule = size 70% 72%, match:title ^(Open File|Save File|Abrir archivo|Guardar archivo|Choose Files|All Files)$
windowrule = float true, match:class ^(xdg-desktop-portal-.*)$

# Ventanas pequeñas y diálogos: centrados, flotantes y proporcionados.
windowrule = float true, match:title ^(?i)(about|acerca de|preferences|preferencias|settings|configuración|properties|propiedades)$
windowrule = center true, match:title ^(?i)(about|acerca de|preferences|preferencias|settings|configuración|properties|propiedades)$
windowrule = float true, match:class ^(org.gnome.Calculator|qalculate-gtk|org.gnome.Loupe|imv)$
windowrule = center true, match:class ^(org.gnome.Calculator|qalculate-gtk|org.gnome.Loupe|imv)$

# Navegadores, editores, música y mensajería no tienen un workspace fijo:
# Hyprland los abre en el workspace que esté activo al iniciarlos.

# Consola desplegable de desarrollo.
windowrule = workspace special:dev silent, match:class ^(dev-scratch)$
windowrule = float true, match:class ^(dev-scratch)$
windowrule = center true, match:class ^(dev-scratch)$
windowrule = size 82% 72%, match:class ^(dev-scratch)$
windowrule = opacity 0.97 0.93, match:class ^(dev-scratch)$

# Left 4 Dead 2 / Source Games (hl2_linux): Forzar en monitor externo (Workspace 1)
windowrule = workspace 1, match:class ^(hl2_linux)$
windowrule = fullscreen 1, match:class ^(hl2_linux)$
windowrule = idle_inhibit always, match:class ^(hl2_linux)$

# ==============================================================================
# RESTAURAR WALLPAPER AUTOMÁTICAMENTE AL INICIAR SESIÓN / REINICIAR
# ==============================================================================
# Fondo restaurado una sola vez desde hypr/startup.conf

# CENTRO DE PRODUCTIVIDAD
bindd = $mainMod, SPACE, [Productividad] centro rápido, exec, ~/.config/hypr/scripts/quick-menu.sh
bindd = $mainMod, Return, [Desarrollo] terminal scratchpad, exec, ~/.config/hypr/scripts/dev-scratchpad.sh
bindd = $mainMod, M, [Multimedia] centro musical, exec, ~/.config/hypr/scripts/music-menu.sh
bindd = $mainMod Alt, F, [Productividad] modo concentración, exec, ~/.config/hypr/scripts/desktop-mode.sh focus
bindd = $mainMod Alt, D, [Sistema] selector de perfil, exec, ~/.config/hypr/scripts/desktop-mode.sh menu
bindd = $mainMod Alt, R, [Sistema] modo equilibrado, exec, ~/.config/hypr/scripts/desktop-mode.sh balanced

# Lavender Mocha: sidebar independiente solo en el Gigabyte detectado por descripción.
exec-once = /home/jerly404/.local/bin/lavender-sidebar start

